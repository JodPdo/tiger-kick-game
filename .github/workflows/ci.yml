name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    name: Godot 4.7 headless — smoke + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate _backlog.json (integrity guard)
        run: python3 tools/validate_backlog.py

      - name: Download Godot 4.7 (linux headless)
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project (headless)
        run: ./godot --headless --import 2>&1 | tee import.log

      - name: Smoke — project opens with no script/parse errors
        run: |
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR: Cannot open" import.log; then
            echo "::error::Import produced errors — see log above"
            exit 1
          fi
          echo "Smoke OK: project imported clean"

      - name: GUT unit tests
        run: |
          if [ ! -f addons/gut/gut_cmdln.gd ]; then
            echo "::error::GUT not found at addons/gut/ — it must be committed to the repo (TK-PX-07)"
            exit 1
          fi
          ./godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit
          echo "GUT unit tests passed"

      - name: Net smoke — 2-instance connect (TK-P0-06 Exit Gate proof)
        timeout-minutes: 3
        run: GODOT_BIN=./godot bash tests/net/run_net_smoke.sh

      - name: Spawn probe — 2-instance regression gate (TK-BUG-P1-01/02)
        timeout-minutes: 3
        run: GODOT_BIN=./godot bash tests/net/run_spawn_probe.sh

      - name: Spawn probe (together) — Waiting Room entry-sweep gate (TK-P2-13)
        timeout-minutes: 3
        run: GODOT_BIN=./godot bash tests/net/run_spawn_probe_together.sh
